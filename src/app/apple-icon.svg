<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#050a17" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <linearGradient id="cyan-electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="12" />

  <circle cx="256" cy="256" r="188" fill="none" stroke="#083344" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="#0e7490" stroke-width="3" opacity="0.4" />

  <polygon
    points="256,92 408,202 350,380 162,380 104,202"
    fill="#081528"
    stroke="url(#cyan-electric)"
    stroke-width="16"
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <line x1="256" y1="92" x2="256" y2="204" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="408" y1="202" x2="316" y2="246" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="350" y1="380" x2="294" y2="298" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="162" y1="380" x2="218" y2="298" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="104" y1="202" x2="196" y2="246" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />

  <polygon
    points="256,204 316,246 294,298 218,298 196,246"
    fill="#0284c7"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linejoin="round"
    filter="url(#core-glow)"
  />

  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#core-glow)" />
  <circle cx="256" cy="256" r="14" fill="#082f49" />
  <circle cx="256" cy="256" r="6" fill="#38bdf8" />

  <circle cx="256" cy="92" r="8" fill="#ffffff" filter="url(#core-glow)" />
  <circle cx="408" cy="202" r="8" fill="#38bdf8" filter="url(#core-glow)" />
  <circle cx="350" cy="380" r="8" fill="#38bdf8" filter="url(#core-glow)" />
  <circle cx="162" cy="380" r="8" fill="#38bdf8" filter="url(#core-glow)" />
  <circle cx="104" cy="202" r="8" fill="#38bdf8" filter="url(#core-glow)" />

  <path
    d="M 236 432 L 276 432 L 260 460 Z"
    fill="#22d3ee"
    filter="url(#neon-glow)"
  />
</svg>
